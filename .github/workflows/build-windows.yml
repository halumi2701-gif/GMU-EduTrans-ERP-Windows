name: Build Windows Installer
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native desktop
        shell: pwsh
        run: dotnet publish src/GMUEduTrans.Desktop/GMUEduTrans.Desktop.csproj -c Release -r win-x64 --self-contained true -o publish
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Setup.exe
        shell: pwsh
        run: iscc installer/GMUEduTrans.iss
      - uses: actions/upload-artifact@v4
        with:
          name: GMU-EduTrans-ERP-Windows-Setup
          path: dist/GMU EduTrans ERP Setup.exe
